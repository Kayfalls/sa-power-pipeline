<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Liberation Sans', Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>sa-power-pipeline architecture</title>
  <desc>EskomSePush API feeds an Airflow pipeline that extracts, loads to BigQuery, checks freshness, runs dbt and tests. GitHub Actions checks every change.</desc>
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B7A5A"/>
    </marker>
    <marker id="arrowInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10203A"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B36B00"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#F3F5F7"/>

  <!-- Title -->
  <text x="80" y="100" font-size="56" font-weight="700" fill="#10203A">sa-power-pipeline</text>
  <text x="80" y="146" font-size="26" fill="#55637A">A daily pipeline that turns South African load shedding data into tested, query-ready tables</text>

  <!-- Source -->
  <rect x="60" y="285" width="210" height="100" rx="10" fill="#FFFFFF" stroke="#10203A" stroke-width="2"/>
  <text x="165" y="328" font-size="22" font-weight="700" fill="#10203A" text-anchor="middle">EskomSePush</text>
  <text x="165" y="357" font-size="17" fill="#55637A" text-anchor="middle">load shedding API</text>

  <!-- Airflow band -->
  <rect x="320" y="205" width="1220" height="210" rx="16" fill="#E6F2EE" stroke="#0B7A5A" stroke-width="2.5"/>
  <text x="345" y="243" font-size="20" font-weight="700" fill="#0B7A5A">Airflow in Docker: runs daily, retries each task 3 times</text>

  <!-- Steps -->
  <g stroke="#0B7A5A" stroke-width="2" fill="#FFFFFF">
    <rect x="345" y="268" width="210" height="118" rx="10"/>
    <rect x="585" y="268" width="210" height="118" rx="10"/>
    <rect x="825" y="268" width="210" height="118" rx="10"/>
    <rect x="1065" y="268" width="210" height="118" rx="10"/>
    <rect x="1305" y="268" width="210" height="118" rx="10"/>
  </g>
  <g font-size="20" font-weight="700" fill="#10203A" text-anchor="middle">
    <text x="450" y="312">Extract</text>
    <text x="690" y="312">Load</text>
    <text x="930" y="312">Freshness gate</text>
    <text x="1170" y="312">dbt run</text>
    <text x="1410" y="312">dbt test</text>
  </g>
  <g font-size="16" fill="#55637A" text-anchor="middle">
    <text x="450" y="340">Pulls status, area</text>
    <text x="450" y="362">and schedule data</text>
    <text x="690" y="340">Appends the raw files</text>
    <text x="690" y="362">to BigQuery</text>
    <text x="930" y="340">Stops the run if data</text>
    <text x="930" y="362">is over 36 hours old</text>
    <text x="1170" y="340">Builds staging and</text>
    <text x="1170" y="362">mart tables</text>
    <text x="1410" y="340">Checks keys, values</text>
    <text x="1410" y="362">and completeness</text>
  </g>
  <g stroke="#0B7A5A" stroke-width="2.5" marker-end="url(#arrowGreen)">
    <line x1="558" y1="327" x2="582" y2="327"/>
    <line x1="798" y1="327" x2="822" y2="327"/>
    <line x1="1038" y1="327" x2="1062" y2="327"/>
    <line x1="1278" y1="327" x2="1302" y2="327"/>
  </g>
  <line x1="272" y1="335" x2="342" y2="335" stroke="#10203A" stroke-width="2.5" marker-end="url(#arrowInk)"/>

  <!-- BigQuery raw -->
  <path d="M560,520 v140 a130,20 0 0 0 260,0 v-140" fill="#DCE4EE" stroke="#8FA3BD" stroke-width="2"/>
  <ellipse cx="690" cy="520" rx="130" ry="20" fill="#E9EEF5" stroke="#8FA3BD" stroke-width="2"/>
  <text x="690" y="575" font-size="20" font-weight="700" fill="#10203A" text-anchor="middle">BigQuery raw</text>
  <text x="690" y="603" font-size="16" fill="#55637A" text-anchor="middle">status, area, schedule</text>
  <text x="690" y="627" font-size="16" fill="#55637A" text-anchor="middle">kept exactly as received</text>
  <line x1="690" y1="389" x2="690" y2="498" stroke="#10203A" stroke-width="2.5" marker-end="url(#arrowInk)"/>
  <text x="706" y="455" font-size="16" fill="#55637A">append only</text>

  <!-- BigQuery models -->
  <path d="M1000,520 v140 a180,20 0 0 0 360,0 v-140" fill="#DCE4EE" stroke="#8FA3BD" stroke-width="2"/>
  <ellipse cx="1180" cy="520" rx="180" ry="20" fill="#E9EEF5" stroke="#8FA3BD" stroke-width="2"/>
  <text x="1180" y="568" font-size="20" font-weight="700" fill="#10203A" text-anchor="middle">BigQuery models</text>
  <text x="1180" y="596" font-size="16" fill="#55637A" text-anchor="middle">stg_status</text>
  <text x="1180" y="618" font-size="16" fill="#55637A" text-anchor="middle">mart_current_status</text>
  <text x="1180" y="640" font-size="16" fill="#55637A" text-anchor="middle">fct_status_history</text>

  <!-- raw to models -->
  <text x="910" y="560" font-size="16" fill="#55637A" text-anchor="middle">dbt turns raw into</text>
  <text x="910" y="580" font-size="16" fill="#55637A" text-anchor="middle">tested models</text>
  <line x1="824" y1="600" x2="996" y2="600" stroke="#10203A" stroke-width="2.5" marker-end="url(#arrowInk)"/>

  <!-- Alert path -->
  <line x1="1480" y1="418" x2="1480" y2="542" stroke="#B36B00" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowAmber)"/>
  <text x="1466" y="486" font-size="17" fill="#B36B00" text-anchor="end">if a task fails</text>
  <rect x="1410" y="545" width="140" height="84" rx="10" fill="#FFFFFF" stroke="#B36B00" stroke-width="2"/>
  <text x="1480" y="583" font-size="20" font-weight="700" fill="#10203A" text-anchor="middle">Discord</text>
  <text x="1480" y="608" font-size="16" fill="#55637A" text-anchor="middle">failure alert</text>

  <!-- CI strip -->
  <rect x="60" y="722" width="1480" height="118" rx="14" fill="#FFFFFF" stroke="#C5CFDB" stroke-width="2"/>
  <text x="90" y="758" font-size="20" font-weight="700" fill="#10203A">GitHub Actions checks every change</text>
  <text x="1510" y="758" font-size="16" fill="#55637A" text-anchor="end">Logs in to Google Cloud without stored keys</text>
  <g fill="#E9EEF4">
    <rect x="90" y="776" width="340" height="44" rx="22"/>
    <rect x="450" y="776" width="340" height="44" rx="22"/>
    <rect x="810" y="776" width="340" height="44" rx="22"/>
    <rect x="1170" y="776" width="340" height="44" rx="22"/>
  </g>
  <g font-size="17" fill="#10203A" text-anchor="middle">
    <text x="260" y="804">Lint and unit tests</text>
    <text x="620" y="804">dbt project parse</text>
    <text x="980" y="804">Airflow image build</text>
    <text x="1340" y="804">dbt build in a test dataset</text>
  </g>

  <!-- Footer -->
  <text x="80" y="876" font-size="18" fill="#55637A">Python, Airflow, dbt, BigQuery, Docker, GitHub Actions</text>
  <text x="1520" y="876" font-size="18" fill="#55637A" text-anchor="end">github.com/Kayfalls/sa-power-pipeline</text>
</svg>