name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint-and-test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: set up python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.12'
            
            - name: install dependencies
              run:
                pip install -r requirements.txt
                pip install -r requirements-dev.txt
                pip install -e .

            - name: lint with ruff
              run:
                ruff check .
                
            - name: Run tests
              run:
                pytest -v