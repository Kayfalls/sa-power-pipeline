version: 2

sources:
  - name: raw
    schema: raw
    config:
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 36, period: hour}
      loaded_at_field: "safe.parse_timestamp('%Y%m%dT%H%M%SZ', cast(extracted_at as string))"
    tables:
      - name: status
      - name: area
      - name: schedule