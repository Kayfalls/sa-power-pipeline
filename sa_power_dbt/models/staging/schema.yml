version: 2

models:
  - name: stg_status
    description: One row per municipality, flattened from the nested raw status record.
    columns:
      - name: region
        description: Municipality/region key (e.g. eskom, capetown)
        tests:
          - not_null
      - name: stage
        description: Current loadshedding stage as a string
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6, 7, 8] 
                quote: false           