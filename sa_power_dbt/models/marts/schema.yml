version: 2

models:
  - name: mart_current_status
    description: The single most recent load shedding status per region, deduplicated by extracted_at.
    columns:
      - name: region
        description: Municipality/region key
        tests:
          - not_null
          - unique
      - name: stage
        description: Current load shedding stage
        tests:
          - not_null
  - name: fct_status_history
    description: Append-only history of load shedding status per region, one row per extraction run. Built incrementally.
    columns: 
      - name: status_key 
        description: Surrogate key (region + extraction timestamp)
        tests:
          - not_null
          - unique
      - name: extracted_ts
        tests:
          - not_null